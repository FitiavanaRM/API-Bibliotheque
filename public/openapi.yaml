openapi: 3.0.3
info:
  title: API Bibliothèque
  description: |
    API REST de gestion de bibliothèque (livres, auteurs, emprunts).

    **Authentification** : appelez `POST /auth/login`, copiez la valeur de `data.token`,
    puis cliquez sur le bouton **Authorize** et collez le token (sans le mot « Bearer »).

    **Endpoints publics** : login, `GET /authors`, `GET /authors/{id}`, `GET /books`, `GET /books/{id}`.
    **Endpoints protégés** : tous les autres (token Bearer obligatoire, sinon HTTP 401).

    **Format des réponses** :
    - Succès : `{ "success": true, "data": ..., "message": "..." }`
    - Erreur : `{ "success": false, "message": "...", "errors": {} }`
  version: 1.0.0
  contact:
    name: HERIFITIAVANA Rotsy Nomena

servers:
  - url: http://localhost:8000/api/v1
    description: Développement
  - url: https://api.mabibliotheque.com/v1
    description: Production

tags:
  - name: Authentification
    description: Obtention du token Bearer
  - name: Authors
    description: Gestion des auteurs
  - name: Books
    description: Gestion des livres
  - name: Borrows
    description: Gestion des emprunts
  - name: Subscriptions
    description: Abonnement Premium (Stripe)
  - name: Webhooks
    description: Événements envoyés par Stripe

paths:
  /auth/login:
    post:
      tags: [Authentification]
      summary: Authentifier un utilisateur et obtenir un token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: admin@bibliotheque.test
              password: password123
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Identifiants invalides
                errors: {}
        '422':
          $ref: '#/components/responses/ValidationError'

  /authors:
    get:
      tags: [Authors]
      summary: Afficher tous les auteurs
      operationId: listAuthors
      security: []
      responses:
        '200':
          description: Liste des auteurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorListResponse'
    post:
      tags: [Authors]
      summary: Créer un auteur
      operationId: createAuthor
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorInput'
            example:
              first_name: Antoine
              last_name: de Saint-Exupéry
              nationality: Française
      responses:
        '201':
          description: Auteur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /authors/{id}:
    get:
      tags: [Authors]
      summary: Afficher un auteur et ses livres
      operationId: getAuthor
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Auteur avec la liste de ses livres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorWithBooksResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Authors]
      summary: Modifier un auteur
      operationId: updateAuthor
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthorInput'
            example:
              nationality: Française
      responses:
        '200':
          description: Auteur modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Authors]
      summary: Supprimer un auteur
      description: La suppression d'un auteur supprime aussi ses livres et leurs emprunts (suppression en cascade).
      operationId: deleteAuthor
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Auteur supprimé (aucun contenu retourné)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /books:
    get:
      tags: [Books]
      summary: Afficher tous les livres (filtre optionnel par disponibilité)
      operationId: listBooks
      security: []
      parameters:
        - name: available
          in: query
          required: false
          description: Filtrer par disponibilité (`true` ou `false`).
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Liste des livres avec leur auteur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Books]
      summary: Ajouter un livre
      operationId: createBook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookInput'
            example:
              title: Le Petit Prince
              isbn: '9782070612758'
              year: 1943
              author_id: 1
      responses:
        '201':
          description: Livre ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /books/{id}:
    get:
      tags: [Books]
      summary: Afficher un livre et son auteur
      operationId: getBook
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Livre avec son auteur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Books]
      summary: Modifier un livre
      operationId: updateBook
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookInput'
            example:
              title: Les Misérables (édition illustrée)
      responses:
        '200':
          description: Livre modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Books]
      summary: Supprimer un livre
      operationId: deleteBook
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Livre supprimé (aucun contenu retourné)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /borrows:
    get:
      tags: [Borrows]
      summary: Afficher les emprunts en cours
      description: Retourne les emprunts actifs (`returned_at` nul) appartenant au compte authentifié.
      operationId: listBorrows
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste des emprunts en cours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Borrows]
      summary: Enregistrer un emprunt
      description: Le livre doit être disponible. Après l'emprunt, `available` passe à `false`.
      operationId: createBorrow
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorrowInput'
            example:
              user_name: Rakoto Jean
              book_id: 1
      responses:
        '201':
          description: Emprunt enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Données invalides ou livre indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Livre indisponible
                errors:
                  book_id:
                    - Ce livre est déjà emprunté et ne peut pas être emprunté.

  /borrows/{id}/return:
    patch:
      tags: [Borrows]
      summary: Marquer un livre comme rendu
      description: Renseigne `returned_at` et remet `available` du livre à `true`. Seul le propriétaire peut rendre son emprunt; un emprunt appartenant à un autre compte est traité comme introuvable. Un emprunt ne peut être rendu qu'une seule fois.
      operationId: returnBorrow
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Livre retourné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Emprunt déjà retourné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Emprunt déjà retourné
                errors:
                  borrow:
                    - Ce livre a déjà été rendu.

  /books/smart-search:
    post:
      tags: [Books]
      summary: Recherche intelligente de livres
      description: L'IA extrait des mots-clés de la description. Les livres retournés proviennent uniquement de la base de données (l'IA n'invente aucun livre).
      operationId: smartSearchBooks
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmartSearchInput'
            example:
              query: Je cherche un livre sur les bonnes pratiques de programmation en Java
      responses:
        '200':
          description: Mots-clés extraits et livres correspondants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /books/{id}/summary:
    get:
      tags: [Books]
      summary: Consulter le résumé d'un livre
      description: Retourne le résumé déjà enregistré, sans appeler l'IA.
      operationId: getBookSummary
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Résumé enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
        '404':
          description: Livre introuvable, ou aucun résumé généré pour ce livre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Aucun résumé disponible pour ce livre
                errors:
                  summary:
                    - Générez-le d'abord avec POST /books/1/summary.
    post:
      tags: [Books]
      summary: Générer le résumé d'un livre avec l'IA
      description: Si le résumé existe déjà, il est retourné sans appeler l'IA. Sinon il est généré (3 phrases maximum, en français) puis enregistré.
      operationId: generateBookSummary
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Résumé généré ou déjà existant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /subscriptions/payment-intent:
    post:
      tags: [Subscriptions]
      summary: Créer un PaymentIntent pour l'abonnement Premium
      description: Crée un paiement Stripe de 500 centimes (5 EUR) avec les métadonnées `user_id` et `plan=premium`. Clés Stripe en mode test uniquement.
      operationId: createPaymentIntent
      security:
        - BearerAuth: []
      responses:
        '200':
          description: PaymentIntent créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /subscriptions/status:
    get:
      tags: [Subscriptions]
      summary: Consulter le statut d'abonnement de l'utilisateur connecté
      operationId: getSubscriptionStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statut de l'abonnement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Recevoir les événements de paiement Stripe
      description: |
        Route publique **sans BearerAuth** : l'authenticité est garantie par la signature Stripe (`Stripe-Signature`, HMAC-SHA256 calculé avec `STRIPE_WEBHOOK_SECRET`).
        Sur `payment_intent.succeeded` avec `plan=premium`, l'utilisateur passe en Premium. Un événement déjà traité est ignoré.

        Swagger UI ne peut pas calculer la signature : pour un test valide, utilisez la requête Postman « Simulate Stripe Webhook ».
      operationId: stripeWebhook
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: Signature Stripe au format `t=timestamp,v1=signature`.
          schema:
            type: string
          example: t=1700000000,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent'
            example:
              id: evt_1234567890
              object: event
              type: payment_intent.succeeded
              data:
                object:
                  id: pi_1234567890
                  object: payment_intent
                  metadata:
                    user_id: '1'
                    plan: premium
      responses:
        '200':
          description: Événement reçu et vérifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
              example:
                received: true
        '401':
          description: Signature Stripe absente ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Signature Stripe invalide
                errors: {}
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Identifiant numérique de la ressource.
      schema:
        type: integer
        minimum: 1
      example: 1

  responses:
    Unauthorized:
      description: Non authentifié (token absent ou invalide)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Non authentifié
            errors: {}
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Ressource introuvable
            errors: {}
    ValidationError:
      description: Validation échouée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Données invalides
            errors:
              isbn:
                - The isbn has already been taken.

    Forbidden:
      description: Limite d'emprunts atteinte (abonnement FREE, 2 emprunts actifs maximum)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Limite d'emprunts atteinte : un abonnement FREE permet au maximum 2 emprunts simultanés. Passez à Premium pour emprunter sans limite."
            errors: {}
    ServiceUnavailable:
      description: Service externe indisponible (IA ou paiement)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Service OpenAI indisponible
            errors: {}
  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          example: 1
        first_name:
          type: string
          example: Victor
        last_name:
          type: string
          example: Hugo
        nationality:
          type: string
          example: Française
        created_at:
          type: string
          format: date-time
          example: '2026-11-18T18:57:21.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-11-18T18:57:21.000000Z'

    Book:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Les Misérables
        isbn:
          type: string
          example: '9782070409228'
        year:
          type: integer
          example: 1862
        available:
          type: boolean
          example: true
        author_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2026-11-18T18:57:21.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-11-18T18:57:21.000000Z'
        summary:
          type: string
          nullable: true
          description: Résumé généré par l'IA.
        summary_generated_by:
          type: string
          nullable: true
          example: gemini-2.5-flash
        summary_generated_at:
          type: string
          format: date-time
          nullable: true
        author:
          $ref: '#/components/schemas/Author'

    AuthorWithBooks:
      allOf:
        - $ref: '#/components/schemas/Author'
        - type: object
          properties:
            books:
              type: array
              items:
                $ref: '#/components/schemas/Book'

    Borrow:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_name:
          type: string
          example: Rakoto Jean
        book_id:
          type: integer
          example: 3
        borrowed_at:
          type: string
          format: date-time
          example: '2026-11-13T18:57:21.000000Z'
        returned_at:
          type: string
          format: date-time
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-11-18T18:57:21.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-11-18T18:57:21.000000Z'
        user_id:
          type: integer
          nullable: true
          example: 1
        payment_status:
          type: string
          enum: [pending, paid, free]
          example: free
        book:
          $ref: '#/components/schemas/Book'

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@bibliotheque.test
        password:
          type: string
          format: password
          example: password123

    CreateAuthorInput:
      type: object
      required: [first_name, last_name, nationality]
      properties:
        first_name:
          type: string
          maxLength: 255
          example: Antoine
        last_name:
          type: string
          maxLength: 255
          example: de Saint-Exupéry
        nationality:
          type: string
          maxLength: 255
          example: Française

    UpdateAuthorInput:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        nationality:
          type: string
          maxLength: 255

    CreateBookInput:
      type: object
      required: [title, isbn, year, author_id]
      properties:
        title:
          type: string
          maxLength: 255
          example: Le Petit Prince
        isbn:
          type: string
          maxLength: 20
          description: ISBN unique.
          example: '9782070612758'
        year:
          type: integer
          minimum: 0
          example: 1943
        available:
          type: boolean
          description: Facultatif, vaut `true` par défaut.
          example: true
        author_id:
          type: integer
          description: Identifiant d'un auteur existant.
          example: 1

    UpdateBookInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        isbn:
          type: string
          maxLength: 20
        year:
          type: integer
          minimum: 0
        available:
          type: boolean
        author_id:
          type: integer

    BorrowInput:
      type: object
      required: [user_name, book_id]
      properties:
        user_name:
          type: string
          maxLength: 255
          example: Rakoto Jean
        book_id:
          type: integer
          example: 1

    AuthPayload:
      type: object
      properties:
        token:
          type: string
          example: 1|Dvln48pOWpXJdlJCOnHBNYXR5DVO3CyV1yMZkGAR7f88276f
        token_type:
          type: string
          example: Bearer
        user:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Administrateur
            email:
              type: string
              example: admin@bibliotheque.test

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Une erreur est survenue
        errors:
          type: object
          additionalProperties: true

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthPayload'
        message:
          type: string
          example: Connexion réussie

    AuthorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Author'
        message:
          type: string
          example: Opération réussie

    AuthorWithBooksResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthorWithBooks'
        message:
          type: string
          example: Auteur récupéré avec succès

    AuthorListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        message:
          type: string
          example: Liste des auteurs

    BookResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Book'
        message:
          type: string
          example: Opération réussie

    BookListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        message:
          type: string
          example: Liste des livres

